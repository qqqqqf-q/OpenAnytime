<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anytime CGM</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--text:#e1e4ea;--muted:#6b6f82;--accent:#60a5fa;--good:#34d399;--warn:#fbbf24;--bad:#f87171}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);padding:16px 20px;max-width:900px;margin:0 auto}
h1{font-size:16px;margin-bottom:2px}
.sub{color:var(--muted);font-size:10px;margin-bottom:14px}
.card{background:var(--card);border-radius:12px;padding:14px 18px;margin-bottom:14px}
.grid{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.grid .kpi{flex:1;min-width:120px;text-align:center}
.grid .kpi .v{font-size:28px;font-weight:700}
.grid .kpi .l{font-size:10px;color:var(--muted);margin-top:2px}
.g{color:var(--good)}.t{color:var(--accent)}.m{color:var(--muted)}
.toolbar{display:flex;gap:6px;margin-bottom:14px;align-items:center}
.toolbar button{background:var(--card);border:1px solid #2a2d3a;color:var(--text);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px}
.toolbar button.on{background:#252836;border-color:#60a5fa;color:#60a5fa}
.toolbar .refresh{font-size:10px;color:var(--muted);margin-left:auto}
canvas{width:100%;height:340px;border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--muted);font-weight:500;padding:6px 10px;border-bottom:1px solid #2a2d3a}
td{padding:5px 10px;border-bottom:1px solid #1e2130}
td.tm{color:var(--muted);font-size:11px}
</style>
</head>
<body>
<h1>🩸 Anytime CGM</h1>
<p class="sub">鱼跃 5 HSE · SN:Q36011016862 · 传感器启动于 7/30 12:19</p>

<div class="toolbar">
  <button onclick="setRange(3)" id="b3">3h</button>
  <button onclick="setRange(6)" id="b6">6h</button>
  <button onclick="setRange(12)" id="b12">12h</button>
  <button onclick="setRange(24)" id="b24" class="on">24h</button>
  <span class="refresh" id="refreshLabel">--</span>
</div>

<div class="grid">
  <div class="kpi"><div class="v g" id="glucose">--</div><div class="l">血糖 mmol/L</div></div>
  <div class="kpi"><div class="v" id="glucoseMg">--</div><div class="l">mg/dL</div></div>
  <div class="kpi"><div class="v t" id="temp">--</div><div class="l">温度 °C</div></div>
  <div class="kpi"><div class="v m" id="rssi">--</div><div class="l">信号 dBm</div></div>
</div>

<canvas id="chart"></canvas>

<div class="card">
<table id="table"><thead><tr><th>时间</th><th>编号</th><th>血糖 mmol/L</th><th>mg/dL</th><th>温度 °C</th><th>信号</th></tr></thead><tbody></tbody></table>
</div>

<script>
const RANGES={3:3,6:6,12:12,24:24};
let rangeH=24,allData=[];

async function load(){
  const[r]=await Promise.all([fetch('/api/readings?limit=2000')]);
  allData=(await r.json()).readings||[];
  const last=allData.length?allData[allData.length-1]:null;
  document.getElementById('glucose').textContent=last?.glucose_mmol?.toFixed(1)||'--';
  document.getElementById('glucoseMg').textContent=last?.glucose_mg||'--';
  document.getElementById('temp').textContent=last?.temperature_c?.toFixed(1)||'--';
  document.getElementById('rssi').textContent=(last?.rssi||'--')+' dBm';
  document.getElementById('refreshLabel').textContent=new Date().toLocaleTimeString('zh-CN');
  draw();drawTable();
}

function setRange(h){rangeH=h;
  document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('on'));
  document.getElementById('b'+h).classList.add('on');
  draw();drawTable();
}

function draw(){
  const canvas=document.getElementById('chart'),ctx=canvas.getContext('2d');
  const dpr=devicePixelRatio||1,W=canvas.clientWidth,H=340;
  canvas.width=W*dpr;canvas.height=H*dpr;ctx.scale(dpr,dpr);
  ctx.fillStyle='#1a1d27';ctx.fillRect(0,0,W,H);
  if(!allData.length){ctx.fillStyle='#6b6f82';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('等待数据...',W/2,H/2);return}

  const now=new Date(),since=new Date(now-rangeH*3600000);
  const data=allData.filter(d=>new Date(d.timestamp)>=since);
  if(data.length<1){ctx.fillStyle='#6b6f82';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('该时间范围内无数据',W/2,H/2);return}

  const pad={t:16,r:24,b:48,l:48},pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
  const yMin=0,yMax=12,yRng=yMax-yMin;
  const t0=since.getTime(),t1=now.getTime(),tRng=t1-t0||1;
  const x=v=>pad.l+((new Date(v.timestamp).getTime()-t0)/tRng)*pw;
  const y=v=>pad.t+(1-(v-yMin)/yRng)*ph;

  ctx.fillStyle='rgba(52,211,153,.06)';
  ctx.fillRect(pad.l,y(7.8),pw,y(3.9)-y(7.8));

  ctx.strokeStyle='#222530';ctx.lineWidth=.5;
  for(let g=0;g<=12;g++){const gy=y(g);ctx.beginPath();ctx.moveTo(pad.l,gy);ctx.lineTo(W-pad.r,gy);ctx.stroke();ctx.fillStyle='#6b6f82';ctx.font='11px monospace';ctx.textAlign='right';ctx.fillText(g,pad.l-6,gy+4)}

  ctx.fillStyle='#6b6f82';ctx.font='10px monospace';ctx.textAlign='center';
  const xSteps=rangeH<=6?6:8;
  for(let i=0;i<=xSteps;i++){const ts=t0+(tRng/xSteps)*i,dt=new Date(ts);const label=rangeH<=6?dt.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):dt.getMonth()+1+'/'+dt.getDate()+' '+dt.getHours()+':00';ctx.fillText(label,pad.l+(pw/xSteps)*i,H-pad.b+18)}

  const useLine=rangeH>=12;
  if(useLine){ctx.strokeStyle='#34d399';ctx.lineWidth=2;ctx.lineJoin='round';ctx.beginPath();for(let i=0;i<data.length;i++){const px=x(data[i]),py=y(data[i].glucose_mmol);i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}ctx.stroke();for(const d of data){ctx.fillStyle='#34d399';ctx.beginPath();ctx.arc(x(d),y(d.glucose_mmol),2.5,0,Math.PI*2);ctx.fill()}}
  else{for(const d of data){ctx.fillStyle='#34d399';ctx.beginPath();ctx.arc(x(d),y(d.glucose_mmol),4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#1a1d27';ctx.lineWidth=1.5;ctx.stroke()}}

  if(data.length){const last=data[data.length-1];ctx.fillStyle='#34d399';ctx.font='bold 13px monospace';ctx.textAlign='left';ctx.fillText(last.glucose_mmol.toFixed(1),Math.min(x(last)+10,W-pad.r-60),y(last.glucose_mmol)-8)}
}

function drawTable(){
  const tbody=document.querySelector('#table tbody');
  if(!tbody)return;
  const now=new Date(),since=new Date(now-rangeH*3600000);
  const data=allData.filter(d=>new Date(d.timestamp)>=since).reverse();
  tbody.innerHTML=data.map(r=>`<tr><td class="tm">${new Date(r.timestamp).toLocaleString('zh-CN')}</td><td>#${r.reading_index||r.counter||'--'}</td><td>${r.glucose_mmol?.toFixed(1)}</td><td>${r.glucose_mg}</td><td>${r.temperature_c?.toFixed(1)}</td><td>${r.rssi}</td></tr>`).join('');
  if(!data.length)tbody.innerHTML='<tr><td colspan="6" style="color:var(--muted)">暂无数据</td></tr>';
}

setRange(24);load();
setInterval(load,60000);
window.addEventListener('resize',draw);
</script>
</body>
</html>
